<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Every data-stm-text element is filled in by options.js from the message
      of that key in i18n.js, in whichever language the settings ask for.
    -->
    <title data-stm-text="options.pageTitle"></title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <!--
      Hidden until the stored language is known, so the page is never seen in
      one language before switching to another.
    -->
    <main hidden>
      <header>
        <img src="icons/icon-48.png" alt="" width="40" height="40" />
        <div>
          <h1 data-stm-text="extension.name"></h1>
          <p data-stm-text="extension.settings"></p>
        </div>
      </header>

      <section id="stm-master-section" class="stm-master"></section>

      <section id="stm-language-section"></section>

      <div id="stm-sections"></div>

      <footer>
        <button
          type="button"
          id="stm-reset"
          data-stm-text="options.reset"
        ></button>
        <p class="stm-note" data-stm-text="options.reset.note"></p>
        <!--
          Filled in from the registry rather than written out: who is credited
          is whoever networks.js says the bundled networks came from.
        -->
        <p class="stm-credits" id="stm-credits"></p>
      </footer>
    </main>

    <script src="i18n.js"></script>
    <script src="networks.js"></script>
    <script src="settings.js"></script>
    <script src="options.js"></script>
  </body>
</html>
