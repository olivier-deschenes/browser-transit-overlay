<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Réglages — Métro STM et REM</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon-48.png" alt="" width="40" height="40" />
        <div>
          <h1>Métro STM et REM pour Marketplace et Centris</h1>
          <p>Réglages de l’extension</p>
        </div>
      </header>

      <section id="stm-master-section" class="stm-master"></section>

      <div id="stm-sections"></div>

      <footer>
        <button type="button" id="stm-reset">Réinitialiser les réglages</button>
        <p class="stm-note">
          Les points de repère enregistrés ne sont pas effacés. L’attribution
          affichée sur la carte fait partie de la licence des données et reste
          en place.
        </p>
        <!--
          Filled in from the registry rather than written out: who is credited
          is whoever networks.js says the bundled networks came from.
        -->
        <p class="stm-credits" id="stm-credits"></p>
      </footer>
    </main>

    <script src="networks.js"></script>
    <script src="settings.js"></script>
    <script src="options.js"></script>
  </body>
</html>
