version: 2
# Routine version-update PRs are paused. Security updates remain independent.
updates:
  - package-ecosystem: npm
    directory: /web
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      tanstack:
        patterns:
          - '@tanstack/*'
      cloudflare:
        patterns:
          - '@cloudflare/*'
          - wrangler
  - package-ecosystem: pip
    directory: /data
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
